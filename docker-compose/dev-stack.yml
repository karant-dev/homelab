version: "3.8"
services:
  ittools:
    image: corentinth/it-tools:latest
    container_name: ittools
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 150
    restart: unless-stopped
    environment:
    - TZ=Europe/Dublin
    ports:
      - "8081:80"
    volumes:
      - /home/karant/docker-data/ittools/config:/config
      - /home/karant/docker-data/ittools/data:/data
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[n]ginx' >/dev/null || pgrep -f '[/]it-tools' >/dev/null || pgrep -f '[n]ode' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homelab-net
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true

  network-tools:
    image: lissy93/networking-toolbox:latest
    container_name: network-tools
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 400
    ports:
      - "8082:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=Europe/Dublin
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 400
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
      - PASSWORD=REDACTED
      - SUDO_PASSWORD=REDACTED
      - PORT=8080
      - CERT=FALSE
    volumes:
      - /home/karant/docker-data/code-server/config:/config
      - /etc/caddy:/workspace/caddy
      - /home/karant/docker-data:/workspace/docker-data
    ports:
      - "8888:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[c]ode-server' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - homelab-net
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 250
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.karant.dev
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n-hooks.karant.dev/
      - GENERIC_TIMEZONE=Europe/Dublin
      - TZ=Europe/Dublin
      - N8N_EDITOR_BASE_URL=https://n8n.karant.dev/
      - N8N_SECURE_COOKIE=false
      - TELEGRAM_CHAT_ID=8110070007
    ports:
      - "5678:5678"
    volumes:
      - /home/karant/docker-data/n8n:/home/node/.n8n
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[n]8n' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true

networks:
  homelab-net:
    external: true