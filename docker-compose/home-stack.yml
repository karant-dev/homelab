services:
  # Recipe & Meal Management
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    ports:
      - "10000:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ${DATA_ROOT}/mealie/data:/app/data
    environment:
      - ALLOW_SIGNUP=false
      - TOKEN_TIME=9600
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    networks:
      - homelab-net

  # Budgeting & Finance (Shared Envelope Budgeting)
