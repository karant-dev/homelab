  memos:
    image: neosmemo/memos:stable
    container_name: memos
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    ports:
      - '8102:5230'
    volumes:
      - /home/karant/docker-data/memos:/var/opt/memos
    environment:
      - MEMOS_MODE=prod
      - MEMOS_PORT=5230
    restart: unless-stopped
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[/]memos' >/dev/null || pgrep -f '[m]emos' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - autoheal=true

  karakeep-app:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - '8103:3000'
    volumes:
      - /home/karant/docker-data/karakeep/data:/data
    environment:
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      - NEXTAUTH_SECRET=REDACTED
      - MEILI_MASTER_KEY=REDACTED
      - NEXTAUTH_URL=https://bookmarks.karant.dev
      - DATA_DIR=/data
      - CRAWLER_STORE_SCREENSHOT=true
      - CRAWLER_FULL_PAGE_SCREENSHOT=true
      - CRAWLER_ENABLE_ADBLOCKER=true
      - CRAWLER_DOWNLOAD_ARCHIVE=true
      - CRAWLER_STORE_PDF=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - INFERENCE_TEXT_MODEL=gemma3:4b
      - INFERENCE_IMAGE_MODEL=gemma3:4b
    networks:
      - homelab-net
      
  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome
    container_name: karakeep-chrome
    restart: unless-stopped
    shm_size: '1gb'
    mem_limit: 1gb
    cpus: 1.0
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    networks:
      - homelab-net

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.13.3
    container_name: karakeep-meilisearch
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=REDACTED
    volumes:
      - /home/karant/docker-data/karakeep/meilisearch:/meili_data
    networks:
      - homelab-net

