version: "3.8"
services:
  bentopdf:
    image: bentopdf/bentopdf:latest
    container_name: bentopdf
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    ports:
      - 8100:8080
    environment:
      - SIMPLE_MODE=true
    restart: unless-stopped
    networks:
      - homelab-net
    labels:
      - com.centurylinklabs.watchtower.enable=true
    
