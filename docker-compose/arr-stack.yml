services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    mem_limit: 256m
    cpus: 1
    pids_limit: 200
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # --- Control Ports (Web UIs) ---
      - 8086:8080   # qBittorrent WebUI (mapped to 8085 to avoid conflict)
      - 9696:9696   # Prowlarr
      - 8989:8989   # Sonarr
      - 8787:8787   # Readarr
      - 8191:8191   # Flaresolverr
      - 8686:8686   # Lidarr
      - 7878:7878   # Radarr
      - 6868:6868   # Profilarr
      - 6767:6767   # Bazarr
      # - 5056:5055   # Jellyseerr
      # --- Torrent Ports ---
      - 6881:6881
      - 6881:6881/udp
    environment:
      # --- SURFSHARK WIREGUARD SETUP ---
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=REDACTED
      - WIREGUARD_ADDRESSES=10.14.0.2/16  # Copy from Surfshark dashboard
      - WIREGUARD_MTU=1280
      - SERVER_COUNTRIES=Netherlands      # Or your preferred P2P friendly location
      - DOT=off
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24
      
      # --- ALTERNATIVE: PIA OPENVPN (Uncomment if switching to PIA) ---
      # - VPN_SERVICE_PROVIDER=private internet access
      # - VPN_TYPE=openvpn
      # - OPENVPN_USER=REDACTED
      # - OPENVPN_PASSWORD=REDACTED
      # - VPN_PORT_FORWARDING=on  # <--- The Magic Switch for PIA
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --tries=1 --timeout=5 https://google.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 3
    pids_limit: 200
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - /home/karant/docker-data/qbittorrent/config:/config
      - /mnt/media/data:/data
    network_mode: "service:gluetun" # Hooks into the VPN network
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://1.1.1.1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 200
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/karant/docker-data/arr/prowlarr/config:/config
    network_mode: "service:gluetun"
    # No healthcheck needed for Prowlarr strictly, but it rides the VPN
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 2. MONITOR: Accurate health check to detect the "zombie" state
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping && curl -Is --connect-timeout 5 https://google.com || exit 1"]
      interval: 30s    # Check every minute
      timeout: 10s     # Fail if it hangs for 10s
      retries: 3       # Restart after 3 failures (3 minutes of downtime)
    labels:
      - "autoheal=true"

  # Sonarr - TV Shows
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 3
    pids_limit: 250
    network_mode: "service:gluetun" # Hooks into the VPN network
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - /home/karant/docker-data/arr/sonarr/config:/config
      - /mnt/media/TV:/tv
      # CRITICAL: Allows Sonarr to see qBit downloads at the same path
      - /mnt/media/data:/data 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping && curl -Is --connect-timeout 5 https://google.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "autoheal=true"

  # Radarr - Movies
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 3
    pids_limit: 250
    network_mode: "service:gluetun" # Hooks into the VPN network
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - /home/karant/docker-data/arr/radarr/config:/config
      - /mnt/media/Movies:/movies
      # CRITICAL: Allows Radarr to see qBit downloads at the same path
      - /mnt/media/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping && curl -Is --connect-timeout 5 https://google.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "autoheal=true"

  # Lidarr - Music
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 3
    pids_limit: 250
    network_mode: "service:gluetun" # Hooks into the VPN network
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - /home/karant/docker-data/arr/lidarr/config:/config
      - /mnt/media/Music:/music
      - /mnt/media/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8686/ping && curl -Is --connect-timeout 5 https://google.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "autoheal=true"

  # Bazarr - Subtitles
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 3
    pids_limit: 300
    network_mode: "service:gluetun" # Hooks into the VPN network
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - /home/karant/docker-data/arr/bazarr/config:/config
      - /mnt/media/Movies:/movies
      - /mnt/media/TV:/tv
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767/ping && curl -Is --connect-timeout 5 https://google.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "autoheal=true"

  # Bookshelf - Audiobooks (Readarr fork)
  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:hardcover
    container_name: bookshelf
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 2
    pids_limit: 250
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Dublin
    volumes:
      - /home/karant/docker-data/arr/bookshelf/config:/config
      - /mnt/media/Audiobooks:/audiobooks
      - /mnt/media/eBooks:/ebooks
      - /mnt/media/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8787/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "autoheal=true"

  # Seerr - Media Requests
  seerr:
   image: ghcr.io/seerr-team/seerr:latest
   init: true
   container_name: seerr
   ports:
    - "5056:5055"
   dns:
    - 1.1.1.1
    - 8.8.8.8
   environment:
    - TZ=Europe/Dublin
    - LOG_LEVEL=debug
   volumes:
    - /home/karant/docker-data/arr/seerr/config:/app/config
   healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
    start_period: 20s
    interval: 15s
    timeout: 3s
    retries: 3
   restart: unless-stopped

  # Flaresolverr - Proxy for Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    mem_limit: 2g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    network_mode: "service:gluetun" # Hooks into the VPN network
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - TZ=Europe/Dublin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "autoheal=true"

  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    network_mode: "service:gluetun" # Hooks into the VPN network
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=Europe/Dublin
    volumes:
      - /home/karant/docker-data/arr/profilarr/config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q gunicorn && cat /proc/1/cmdline | tr '\\0' ' ' | grep -q 6868"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "autoheal=true"
      - com.centurylinklabs.watchtower.enable=true

networks:
  homelab-net:
    external: true